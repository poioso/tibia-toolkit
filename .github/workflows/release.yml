name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated tag to release, for example v0.7.6
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify tested beta artifact
    runs-on: windows-2025
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      artifact_name: release-${{ github.run_id }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate version and tag
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.release_tag }}' } else { $env:GITHUB_REF_NAME }
          if ($tag -ne "v$version") { throw "A tag $tag nao corresponde a versao $version." }
          if (-not (Test-Path -LiteralPath "docs/release-artifacts/$version.json")) {
            throw "Metadados imutaveis ausentes para $version."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download exact beta artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content -Raw "docs/release-artifacts/$env:RELEASE_VERSION.json" | ConvertFrom-Json
          if ($metadata.version -ne $env:RELEASE_VERSION) { throw 'Versao divergente nos metadados.' }

          $releaseDirectory = Join-Path $PWD 'release-artifact'
          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null
          $installerName = "Tibia Toolkit Setup $env:RELEASE_VERSION.exe"
          $blockmapName = "$installerName.blockmap"
          $baseUrl = 'https://downloads.tibiatoolkit.com/updates-beta'

          Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/latest.yml" -OutFile (Join-Path $releaseDirectory 'latest.yml')
          Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/$([Uri]::EscapeDataString($installerName))" -OutFile (Join-Path $releaseDirectory $installerName)
          Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/$([Uri]::EscapeDataString($blockmapName))" -OutFile (Join-Path $releaseDirectory $blockmapName)

          $expected = @{
            'latest.yml' = $metadata.latestYml
            $installerName = $metadata.installer
            $blockmapName = $metadata.blockmap
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $releaseDirectory $entry.Key
            $size = (Get-Item -LiteralPath $path).Length
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($size -ne [Int64]$entry.Value.bytes) { throw "Tamanho divergente: $($entry.Key)" }
            if ($hash -ne [string]$entry.Value.sha256) { throw "SHA-256 divergente: $($entry.Key)" }
          }

          $manifest = Get-Content -Raw (Join-Path $releaseDirectory 'latest.yml')
          if ($manifest -notmatch "(?m)^version:\s*$([regex]::Escape($env:RELEASE_VERSION))\s*$") {
            throw 'latest.yml aponta para outra versao.'
          }

          $stableInstaller = Join-Path $releaseDirectory 'Tibia-Toolkit-Setup.exe'
          Copy-Item -LiteralPath (Join-Path $releaseDirectory $installerName) -Destination $stableInstaller
          if ((Get-FileHash -LiteralPath $stableInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $metadata.installer.sha256) {
            throw 'O asset estavel nao corresponde ao instalador beta.'
          }

          $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $releaseDirectory $installerName)
          if ($signature.Status -ne 'NotSigned') {
            throw "Estado Authenticode inesperado: $($signature.Status)"
          }
          .\scripts\generate-checksums.ps1 -InputPath $releaseDirectory

      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified unsigned release
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: release

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: release/Tibia Toolkit Setup ${{ needs.prepare.outputs.version }}.exe

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release $RELEASE_TAG ja existe; substituicao em lugar e proibida." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --title "Tibia Toolkit $RELEASE_VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            "release/Tibia Toolkit Setup $RELEASE_VERSION.exe" \
            "release/Tibia Toolkit Setup $RELEASE_VERSION.exe.blockmap" \
            release/Tibia-Toolkit-Setup.exe \
            release/latest.yml \
            release/SHA256SUMS.txt
