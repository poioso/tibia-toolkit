<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
      padding: 3px;
      font: 700 12px/1.25 "Trebuchet MS", "Segoe UI", sans-serif;
      color: #eef4ff;
    }
    #tooltip {
      width: calc(100% - 6px);
      max-width: none;
      padding: 8px 11px;
      border: 1px solid rgba(91, 232, 143, .62);
      border-radius: 7px;
      background: rgba(28, 33, 42, .98);
      white-space: normal;
      text-align: center;
    }
    #tooltip.error {
      border-color: rgba(255, 82, 82, .92);
      color: #ffd7d7;
      box-shadow: 0 0 0 1px rgba(255, 82, 82, .2), 0 0 12px rgba(170, 22, 22, .24);
    }
  </style>
</head>
<body>
  <div id="tooltip">Arraste para mover a janela do aplicativo</div>
  <script>
    const tooltip = document.querySelector("#tooltip");
    window.windowMoveHandleTooltipApi?.onRender((payload) => {
      const data = payload && typeof payload === "object" ? payload : { text: payload, tone: "default" };
      if (data.text) tooltip.textContent = data.text;
      tooltip.classList.toggle("error", data.tone === "error");
    });
  </script>
</body>
</html>
