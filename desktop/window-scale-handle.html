<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Escala proporcional</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; user-select: none; }
    body { display: grid; place-items: center; padding: 3px; }
    #scale-handle {
      width: 40px; height: 40px; display: grid; place-items: center; padding: 4px;
      border: 1px solid rgba(148, 163, 184, .25); border-radius: 8px;
      background: linear-gradient(180deg, rgba(42, 48, 59, .98), rgba(30, 35, 44, .98));
      cursor: nwse-resize; touch-action: none;
    }
    #scale-handle:hover { border-color: rgba(91, 232, 143, .72); background: linear-gradient(180deg, rgba(50, 58, 69, .99), rgba(34, 40, 49, .99)); filter: brightness(1.06); }
    #scale-handle.dragging { border-color: #5be88f; }
    #scale-icon { width: 31px; height: 31px; display: block; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
  </style>
</head>
<body>
  <div id="scale-handle" role="button" aria-label="Arraste para redimensionar proporcionalmente o aplicativo">
    <img id="scale-icon" src="tibiatoolkit://app/assets/window-controls/resize-window.png" alt="">
  </div>
  <script>
    const handle = document.querySelector("#scale-handle");
    let dragging = false;
    let activePointerId = null;
    function finish() {
      if (!dragging) return;
      dragging = false;
      activePointerId = null;
      handle.classList.remove("dragging");
      window.windowScaleHandleApi?.endDrag();
    }
    handle.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      dragging = true;
      activePointerId = event.pointerId;
      handle.classList.add("dragging");
      handle.setPointerCapture(event.pointerId);
      window.windowScaleHandleApi?.setHovering(false);
      window.windowScaleHandleApi?.startDrag({ screenX: event.screenX, screenY: event.screenY });
      event.preventDefault();
    });
    handle.addEventListener("pointerenter", () => window.windowScaleHandleApi?.setHovering(true));
    handle.addEventListener("pointerleave", () => {
      if (!dragging) window.windowScaleHandleApi?.setHovering(false);
    });
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
    handle.addEventListener("lostpointercapture", finish);
    window.addEventListener("blur", finish);
  </script>
</body>
</html>
